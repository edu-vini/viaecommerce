services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: via-ecommerce-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - via_ecommerce_vendor:/var/www/html/vendor
      - via_ecommerce_views:/var/www/html/storage/framework/views
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/zzz-performance.conf:/usr/local/etc/php-fpm.d/zzz-performance.conf
      - ./docker/php/preload.php:/usr/local/etc/php/preload.php
    environment:
      - APP_NAME=ViaEcommerce
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8088
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=via_ecommerce
      - DB_USERNAME=via_user
      - DB_PASSWORD=via_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    ports:
      - "5173:5173"
    networks:
      - via_ecommerce_network

  web:
    image: nginx:alpine
    container_name: via-ecommerce-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - via_ecommerce_network

  db:
    image: mysql:8.4
    container_name: via-ecommerce-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: via_ecommerce
      MYSQL_USER: via_user
      MYSQL_PASSWORD: via_secret
    ports:
      - "3307:3306"
    volumes:
      - via_ecommerce_db_data:/var/lib/mysql
    networks:
      - via_ecommerce_network

  redis:
    image: redis:7-alpine
    container_name: via-ecommerce-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - via_ecommerce_redis_data:/data
    networks:
      - via_ecommerce_network

  # Cloudflare Tunnel (HTTPS público gratuito ou via Token Cloudflare Zero Trust)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: via-ecommerce-tunnel
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://web:80}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - via_ecommerce_network
    depends_on:
      - web

volumes:
  via_ecommerce_db_data:
    driver: local
  via_ecommerce_redis_data:
    driver: local
  via_ecommerce_vendor:
    driver: local
  via_ecommerce_views:
    driver: local

networks:
  via_ecommerce_network:
    driver: bridge
