services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: via-ecommerce-app-prod
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - via_ecommerce_prod_vendor:/var/www/html/vendor
      - via_ecommerce_prod_views:/var/www/html/storage/framework/views
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/zzz-performance.conf:/usr/local/etc/php-fpm.d/zzz-performance.conf:ro
      - ./docker/php/preload.php:/usr/local/etc/php/preload.php:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - via_ecommerce_prod_network

  web:
    image: nginx:alpine
    container_name: via-ecommerce-web-prod
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      caddy: "https://"
      caddy.tls.on_demand: ""
      caddy.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - app
    networks:
      - via_ecommerce_prod_network
      - proxy_network

  db:
    image: mysql:8.4
    container_name: via-ecommerce-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      MYSQL_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - via_ecommerce_prod_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - via_ecommerce_prod_network

  redis:
    image: redis:7-alpine
    container_name: via-ecommerce-redis-prod
    restart: unless-stopped
    volumes:
      - via_ecommerce_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - via_ecommerce_prod_network

volumes:
  via_ecommerce_prod_db_data:
    driver: local
  via_ecommerce_prod_redis_data:
    driver: local
  via_ecommerce_prod_vendor:
    driver: local
  via_ecommerce_prod_views:
    driver: local

networks:
  via_ecommerce_prod_network:
    driver: bridge
  proxy_network:
    external: true
    name: ${PROXY_NETWORK:-viasolutions}
